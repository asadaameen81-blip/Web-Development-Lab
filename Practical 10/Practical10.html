<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-4xl mx-auto p-4">

    <h1 class="text-2xl md:text-3xl font-bold text-center my-6">💰 Daily Expense Tracker</h1>

    <!-- Summary cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p class="text-sm text-slate-500">Balance</p>
        <p id="balance" class="text-2xl font-bold">₹0</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p class="text-sm text-slate-500">Income</p>
        <p id="income" class="text-2xl font-bold text-green-600">₹0</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p class="text-sm text-slate-500">Expense</p>
        <p id="expense" class="text-2xl font-bold text-red-600">₹0</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Form -->
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="text-lg font-semibold mb-4">Add Transaction</h2>
        <form id="form" class="space-y-3">
          <input id="title" type="text" placeholder="Description (e.g. Lunch)" required
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <input id="amount" type="number" min="1" placeholder="Amount (₹)" required
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <select id="type" class="w-full border rounded-lg px-3 py-2">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
            Add
          </button>
        </form>
      </div>

      <!-- History -->
      <div class="bg-white rounded-xl shadow p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold">History</h2>
          <select id="filter" class="border rounded-lg px-2 py-1 text-sm">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <ul id="list" class="space-y-2 max-h-80 overflow-y-auto"></ul>
      </div>

    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

    const form = document.getElementById("form");
    const list = document.getElementById("list");
    const filter = document.getElementById("filter");

    function save() {
      localStorage.setItem("transactions", JSON.stringify(transactions));
    }

    function render() {
      const type = filter.value;
      const shown = type === "all" ? transactions : transactions.filter(t => t.type === type);

      list.innerHTML = shown.length === 0
        ? '<li class="text-center text-slate-400 py-6">No transactions yet</li>'
        : shown.map(t => `
          <li class="flex justify-between items-center border-l-4 ${t.type === "income" ? "border-green-500" : "border-red-500"} bg-slate-50 rounded px-3 py-2">
            <span>${t.title}</span>
            <span class="flex items-center gap-3">
              <b class="${t.type === "income" ? "text-green-600" : "text-red-600"}">
                ${t.type === "income" ? "+" : "-"}₹${t.amount}
              </b>
              <button onclick="removeItem(${t.id})" class="text-slate-400 hover:text-red-600">✕</button>
            </span>
          </li>`).join("");

      const income = transactions.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
      const expense = transactions.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);

      document.getElementById("income").textContent = "₹" + income;
      document.getElementById("expense").textContent = "₹" + expense;
      document.getElementById("balance").textContent = "₹" + (income - expense);
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      transactions.unshift({
        id: Date.now(),
        title: document.getElementById("title").value.trim(),
        amount: Number(document.getElementById("amount").value),
        type: document.getElementById("type").value
      });
      save();
      render();
      form.reset();
    });

    function removeItem(id) {
      transactions = transactions.filter(t => t.id !== id);
      save();
      render();
    }

    filter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
