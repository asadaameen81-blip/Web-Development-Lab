<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal To-Do List</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-start justify-center p-4 sm:p-8">

  <!-- Main container card -->
  <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-slate-800">My Tasks</h1>
    <p id="counter" class="text-sm text-slate-500 mt-1 mb-4">0 of 0 tasks completed</p>

    <!-- Input area -->
    <div class="flex gap-2">
      <input
        id="taskInput"
        type="text"
        placeholder="e.g. Submit Subject report"
        class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
      <button
        id="addBtn"
        class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors"
      >
        Add Task
      </button>
    </div>
    <p id="error" class="text-sm text-red-600 mt-2 hidden">Please enter a task before adding.</p>

    <!-- Task list container -->
    <ul id="taskList" class="mt-5 space-y-2"></ul>

    <p id="emptyMsg" class="text-center text-slate-400 mt-6">No tasks yet. Add your first one above.</p>
  </main>

  <script>
    // Select DOM elements
    const taskInput = document.getElementById('taskInput');
    const addBtn    = document.getElementById('addBtn');
    const taskList  = document.getElementById('taskList');
    const counter   = document.getElementById('counter');
    const emptyMsg  = document.getElementById('emptyMsg');
    const errorMsg  = document.getElementById('error');

    // Update the "x of y completed" count and the empty-state message
    function updateCounter() {
      const total = taskList.children.length;
      const done  = taskList.querySelectorAll('input[type="checkbox"]:checked').length;
      counter.textContent = `${done} of ${total} tasks completed`;
      emptyMsg.classList.toggle('hidden', total > 0);
    }

    // Create a task row dynamically
    function createTask(text) {
      const li = document.createElement('li');
      li.className = 'flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'h-5 w-5 accent-indigo-600 cursor-pointer';

      const span = document.createElement('span');
      span.className = 'flex-1 text-slate-800 break-words';
      span.textContent = text; // textContent prevents HTML injection

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.className = 'text-sm text-red-500 hover:text-red-700 font-medium';

      // Toggle completed style
      checkbox.addEventListener('change', () => {
        span.classList.toggle('line-through', checkbox.checked);
        span.classList.toggle('text-gray-400', checkbox.checked);
        li.classList.toggle('opacity-70', checkbox.checked);
        updateCounter();
      });

      // Remove the task from the DOM
      delBtn.addEventListener('click', () => {
        li.remove();
        updateCounter();
      });

      li.append(checkbox, span, delBtn);
      return li;
    }

    // Validate input, add task, reset field
    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') {
        errorMsg.classList.remove('hidden');
        return;
      }
      errorMsg.classList.add('hidden');
      taskList.appendChild(createTask(text));
      taskInput.value = '';
      taskInput.focus();
      updateCounter();
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    updateCounter();
  </script>
</body>
</html>
